name: Release (macOS, bear-net build)

# Builds the macOS app (zipped .app) for Apple Silicon and Intel, ad-hoc
# signs it, and attaches both zips to the GitHub Release matching the current
# package.json version.
#
# This is deliberately independent of release-windows.yml:
#   - manual trigger only (workflow_dispatch) - it never runs on its own
#   - it does not change package.json, forge.config.ts or any source file
#   - it uploads ONLY the two macOS zips (Stoat-darwin-*.zip) with `gh`; the
#     Windows installer / RELEASES / nupkg on the release are never touched
#
# Signing: the app is AD-HOC signed on the runner (codesign --sign -). This is
# not a Developer ID signature and is not notarized (no Apple Developer
# account), so on first launch macOS shows "Apple could not verify ..." and the
# user must click System Settings -> Privacy & Security -> "Open Anyway" once.
# Without the ad-hoc signature macOS reports the app as "damaged" and offers no
# way through except Terminal, which is why this step exists.
#
# Auto-update does not work on macOS for apps that are not Developer-ID signed
# (update-electron-app requires code signing on macOS), so macOS users
# re-download new versions from the Releases page by hand.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-macos:
    name: Build & publish macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon (arm64)
            arch: arm64
          - os: macos-26-intel    # Intel (x64)
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Stoat brand assets
        run: git -c submodule."assets".update=checkout submodule update --init assets

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package app
        run: pnpm exec electron-forge package --arch=${{ matrix.arch }}

      - name: Ad-hoc sign app
        run: |
          APP="out/Stoat-darwin-${{ matrix.arch }}/Stoat.app"
          test -d "$APP" || { echo "app bundle not found at $APP"; ls -R out | head -50; exit 1; }
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Zip app
        run: pnpm exec electron-forge make --skip-package --arch=${{ matrix.arch }}

      - name: Upload macOS zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ZIP="$(ls out/make/zip/darwin/${{ matrix.arch }}/Stoat-darwin-${{ matrix.arch }}-*.zip)"
          echo "Uploading $ZIP to release v$VERSION"
          gh release upload "v$VERSION" "$ZIP" --clobber
